name: Daily flight price tracker

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plane-ticket-track:
    name: Plane Ticket Track
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run tracker
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          python tracker.py --config config.json 2>&1 | tee tracker-output.log
      - name: Upload tracker output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracker-output
          path: tracker-output.log
      - name: Commit price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update flight price history"
          git push
